steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/Dockerfile.api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/plataforma-api'
      - '.'

  # Push image to registry before deploying
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/plataforma-api']

  # Apply pending database migrations before deploying (fail build on error)
  # Se invoca el binario de Prisma 6 que ya viene en la imagen. Con `npx` sin `dir`,
  # Cloud Build corre desde /workspace, no encuentra node_modules y descarga Prisma 7,
  # que rechaza el `url` del datasource (P1012) y rompe el pipeline.
  - name: 'gcr.io/$PROJECT_ID/plataforma-api'
    dir: '/app'
    entrypoint: 'node'
    args:
      - '/app/node_modules/prisma/build/index.js'
      - 'migrate'
      - 'deploy'
      - '--schema=/app/packages/database/prisma/schema.prisma'
    secretEnv: ['DATABASE_URL']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'plataforma-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/plataforma-api'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '1'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--update-secrets'
      # Solo los secretos que existen en Secret Manager. PAYPHONE_APP_ID/PAYPHONE_TOKEN
      # no se usan: cada tenant guarda su token y storeId en tenant.settings.
      # Referenciarlos aqui hacia fallar el deploy por secreto inexistente.
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,CSRF_SECRET=CSRF_SECRET:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_BUCKET_NAME=R2_BUCKET_NAME:latest,R2_PUBLIC_URL=R2_PUBLIC_URL:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,BILLING_WEBHOOK_SECRET=BILLING_WEBHOOK_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/plataforma-api'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
timeout: '600s'
options:
  logging: CLOUD_LOGGING_ONLY
