steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-f'
      - 'docker/Dockerfile.api'
      - '-t'
      - 'gcr.io/$PROJECT_ID/plataforma-api'
      - '.'

  # Push image to registry before deploying
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: ['push', 'gcr.io/$PROJECT_ID/plataforma-api']

  # Descarga el Cloud SQL Auth Proxy en /workspace para poder usarlo desde el
  # paso de migraciones (los pasos de Cloud Build estan aislados entre si).
  - name: 'gcr.io/cloud-builders/wget'
    id: 'proxy-install'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'wget -q -O /workspace/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64 && chmod +x /workspace/cloud-sql-proxy'
    waitFor: ['-']

  # Apply pending database migrations before deploying (fail build on error)
  # El DATABASE_URL usa el socket unix `unix:/cloudsql/...`, asi que el proxy se
  # arranca dentro de este mismo paso: un sidecar en primer plano nunca termina y
  # cuelga el build. Se invoca el binario de Prisma 6 que ya viene en la imagen.
  - name: 'gcr.io/$PROJECT_ID/plataforma-api'
    id: 'migrate'
    dir: '/app'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'mkdir -p /cloudsql; /workspace/cloud-sql-proxy --unix-socket=/cloudsql iceberg-460502:us-central1:plataforma-mysql & PROXY_PID=$$!; for i in $$(seq 1 30); do [ -S /cloudsql/iceberg-460502:us-central1:plataforma-mysql ] && break; sleep 1; done; node /app/node_modules/prisma/build/index.js migrate deploy --schema=/app/packages/database/prisma/schema.prisma; RC=$$?; kill $$PROXY_PID 2>/dev/null; exit $$RC'
    secretEnv: ['DATABASE_URL']
    waitFor: ['proxy-install', 'push-image']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'plataforma-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/plataforma-api'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '1'
      - '--update-env-vars'
      - 'NODE_ENV=production'
      - '--update-secrets'
      # Solo los secretos que existen en Secret Manager. PAYPHONE_APP_ID/PAYPHONE_TOKEN
      # no se usan: cada tenant guarda su token y storeId en tenant.settings.
      # Referenciarlos aqui hacia fallar el deploy por secreto inexistente.
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,CSRF_SECRET=CSRF_SECRET:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_BUCKET_NAME=R2_BUCKET_NAME:latest,R2_PUBLIC_URL=R2_PUBLIC_URL:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,BILLING_WEBHOOK_SECRET=BILLING_WEBHOOK_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/plataforma-api'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
timeout: '600s'
options:
  logging: CLOUD_LOGGING_ONLY
